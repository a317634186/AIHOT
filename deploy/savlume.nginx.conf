# Host Nginx deployment. Certificates are maintained by /root/.acme.sh.
# Query strings, cookies, authorization and referrers are excluded from access logs.
# Short shared cache for public pages: the app marks them with s-maxage/X-Accel-Expires; anything
# private, no-store, non-200 or carrying Set-Cookie is never stored. Admin sessions bypass it.
proxy_cache_path /www/wwwroot/savlume.com/proxy_cache levels=1:2 keys_zone=savlume_pages:32m inactive=30m max_size=2g use_temp_path=off;
log_format savlume_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 80;
    server_name savlume.com www.savlume.com;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/savlume.com;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://savlume.com$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name www.savlume.com;
    ssl_certificate /www/server/panel/vhost/cert/savlume.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/savlume.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://savlume.com$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name savlume.com;
    include /www/server/panel/vhost/nginx/savlume-cloudflare-realip.inc;
    ssl_certificate /www/server/panel/vhost/cert/savlume.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/savlume.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SAVLUME:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    access_log /www/wwwlogs/savlume.com.log savlume_safe;
    error_log /www/wwwlogs/savlume.com.error.log;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    client_max_body_size 12m;
    location ~* (^|/)\.(?!well-known(?:/|$)) { return 404; }
    location ~* ^/(?:node_modules|packages|database|deploy|scripts|industry|apps)(?:/|$) { return 404; }
    location ~* \.(?:env|pem|key|sql|log|bak|backup|ya?ml|map)$ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_read_timeout 120s;
        proxy_cache savlume_pages;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale updating error timeout http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_no_cache $cookie_aihot_admin $http_authorization;
        proxy_cache_bypass $cookie_aihot_admin $http_authorization;
        add_header X-Cache $upstream_cache_status always;
    }
}
